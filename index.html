<head>

<body>

        <div>10 - он</div>
        <div>20 - жыйырма</div>
        <div>30 - отуз</div>
        <div>40 - кырк</div>
        <div>50 - элүү</div>
        <div>60 - алтымыш</div>
        <div>70 - жетимиш</div>
        <div>80 - сексен</div>
        <div>90 - токсон</div>
        <div>100 - жүз</div>
        <div>1000 - миң</div>

    </label>
  </div>

</html>
